<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务器资源监控器</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#121d2a;--line:#253549;--muted:#8da1b8;--green:#5ee3b2;--blue:#76adff;--orange:#ffcb79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4fc;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1540px;margin:auto;padding:38px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;letter-spacing:1px;margin:8px 0}h2{margin:0;font-size:23px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:3px}p,.muted{color:var(--muted);line-height:1.7}button,input{font:inherit;color:inherit;background:#1a2a3d;border:1px solid #334963;border-radius:8px;padding:10px 14px}button{cursor:pointer}button:hover{border-color:var(--green)}input{width:180px}form{display:flex;gap:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.summary>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px}.summary strong{display:block;font-size:29px;margin-top:8px}.summary small{font-size:13px;font-weight:400;color:var(--muted)}#servers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.server{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:24px}.server.offline{border-color:#815e3c}.top{display:flex;justify-content:space-between;align-items:center}.badge{color:var(--green);background:#15392f;border-radius:20px;padding:6px 10px;font-size:12px}.offline .badge{color:var(--orange);background:#48371e}.remove{background:none;padding:3px 8px;color:var(--muted);margin-left:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.value{font-size:25px;font-weight:600;margin:7px 0}.bar{height:5px;background:#273649;border-radius:8px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:8px}.bar.blue i{background:var(--blue)}.section-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:20px 0 12px}.gpu{padding:14px;background:#0e1723;border:1px solid #233348;border-radius:10px;margin:10px 0}.gpu-title{display:flex;justify-content:space-between;gap:10px}.gpu-title strong{font-size:13px}.gpu-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}.gpu b{font-size:20px}.tiny{font-size:12px;color:var(--muted)}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:14px}.error{background:#3b2b20;color:var(--orange);padding:12px;border-radius:8px;overflow-wrap:anywhere;margin:14px 0}.chart{width:100%;height:70px;background:#0e1723;border-radius:6px}details{margin-top:18px}summary{cursor:pointer;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}td.name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{margin-top:24px;color:var(--muted);font-size:12px}#message{color:var(--orange);margin-top:12px}#connection{display:none}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:1000px){main{padding:22px}header{align-items:flex-start;flex-direction:column}#servers{grid-template-columns:1fr}}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}form{flex-wrap:wrap}.server{padding:17px}main{padding:14px}}
</style><main><header><div><div class="eyebrow">COMPUTE OBSERVATORY / 本地工作台</div><h1>服务器资源监控器</h1><p>多台服务器，一个视野。通过 SSH 实时查看计算资源。</p></div><form id="add"><input id="alias" placeholder="SSH 别名，例如 my-server" aria-label="SSH 服务器别名" required><button>＋ 添加服务器</button></form></header><div id="message" role="status"></div><div id="connection" class="error" role="alert">本地采集服务连接中断。以下显示为旧数据，请重新启动程序。</div><section class="summary" id="summary"></section><section id="servers"></section><footer>仅本机可访问 · 每 5 秒采集（慢连接可能延迟） · 趋势保留最近 120 次成功采样</footer></main>
<script>
let token='', latest=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,n=0)=>v==null?'—':Number(v).toFixed(n), gib=v=>num(v/1073741824,1), pct=v=>Math.min(100,Math.max(0,Number(v)||0));
const bar=(v,blue=false)=>`<div class="bar ${blue?'blue':''}"><i style="width:${pct(v)}%"></i></div>`;
function chart(history){const values=history||[];if(values.length<2)return '<div class="empty">正在积累趋势数据…</div>';return `<svg class="chart" viewBox="0 0 500 70" preserveAspectRatio="none" role="img" aria-label="CPU 和 GPU 利用率趋势">${['cpu','gpu'].map((k,j)=>`<polyline fill="none" stroke="${j?'#76adff':'#5ee3b2'}" stroke-width="2" points="${values.map((v,i)=>v[k]==null?'':`${i*500/(values.length-1)},${65-pct(v[k])*.6}`).filter(Boolean).join(' ')}"/>`).join('')}</svg>`}
function render(data){const expanded=new Set([...document.querySelectorAll('.server')].filter(e=>e.querySelector('details[open]')).map(e=>e.querySelector('h2').textContent));latest=data;token=data.token;const online=data.servers.filter(s=>s.status==='online'),gpus=online.flatMap(s=>s.gpus||[]),free=gpus.reduce((a,g)=>a+(g.total!=null&&g.used!=null?g.total-g.used:0),0);document.querySelector('#summary').innerHTML=`<div>在线服务器<strong>${online.length} <small>/ ${data.servers.length} 台</small></strong></div><div>在线 GPU<strong>${gpus.length} <small>张</small></strong></div><div>可用显存合计<strong>${num(free/1024,1)} <small>GiB</small></strong></div><div>在线 CPU 核心<strong>${online.reduce((a,s)=>a+(s.cpu_count||0),0)} <small>逻辑核心</small></strong></div>`;
document.querySelector('#servers').innerHTML=data.servers.map(s=>`<article class="server ${s.status==='offline'?'offline':''}"><div class="top"><div><h2>${esc(s.alias)}</h2><span class="tiny">${esc(s.hostname||'等待采集')}</span></div><div><span class="badge">${s.status==='online'?'● 在线':s.status==='offline'?'● 连接中断':'◌ 连接中'}</span><button class="remove" data-remove="${esc(s.alias)}" title="移除此监控">×</button></div></div>${s.error?`<div class="error">数据已过期 · ${esc(s.error)}</div>`:''}${s.cpu_percent!=null?`<div class="metrics"><div><span class="muted">CPU 使用率</span><div class="value">${num(s.cpu_percent,1)}%</div>${bar(s.cpu_percent)}<span class="tiny">${s.cpu_count} 逻辑核心 · 1 分钟负载 ${num(s.load[0],2)}</span></div><div><span class="muted">内存使用率</span><div class="value">${num(s.memory_percent,1)}%</div>${bar(s.memory_percent,true)}<span class="tiny">${gib(s.memory_used)} / ${gib(s.memory_total)} GiB</span></div></div><div class="section-label">GPU · ${(s.gpus||[]).length} 张显卡</div>${s.gpu_error?`<div class="error">GPU 指标不可用：${esc(s.gpu_error)}</div>`:''}${(s.gpus||[]).map(g=>`<div class="gpu"><div class="gpu-title"><strong>#${esc(g.index)} &nbsp; ${esc(g.name)}</strong><span class="tiny">${num(g.temp)}°C · ${num(g.power)} / ${num(g.power_limit)} W</span></div><div class="gpu-grid"><div><span class="tiny">GPU 利用率</span><div><b>${num(g.util)}%</b></div>${bar(g.util)}</div><div><span class="tiny">显存占用</span><div><b>${num(g.used/1024,1)}</b> <span class="tiny">/ ${num(g.total/1024,1)} GiB</span></div>${bar(g.total?g.used/g.total*100:0,true)}</div></div></div>`).join('')}<div class="section-label">近期趋势 <span style="color:var(--green)">CPU</span> / <span style="color:var(--blue)">GPU 均值</span></div>${chart(s.history)}<details ${expanded.has(s.alias)?'open':''}><summary>GPU 计算进程 · ${(s.processes||[]).length}</summary><table><thead><tr><th>GPU</th><th>PID</th><th>进程</th><th>显存 MiB</th></tr></thead><tbody>${(s.processes||[]).map(p=>`<tr><td>${esc((s.gpus.find(g=>g.uuid===p.uuid)||{}).index??'—')}</td><td>${esc(p.pid)}</td><td class="name" title="${esc(p.name)}">${esc(p.name)}</td><td>${num(p.memory)}</td></tr>`).join('')||'<tr><td colspan="4">暂无可见计算进程</td></tr>'}</tbody></table></details><div class="foot"><span>最后成功采集 ${new Date(s.updated*1000).toLocaleTimeString()}</span><span>采集耗时 ${s.latency_ms} ms</span></div>`:'<div class="empty">正在通过 SSH 获取资源信息…</div>'}</article>`).join('')||'<div class="empty">添加 SSH 别名，开始监控服务器。</div>';
}
async function refresh(){try{const res=await fetch('/api/state',{signal:AbortSignal.timeout(5000)});if(!res.ok)throw Error('服务不可用');render(await res.json());document.querySelector('#connection').style.display='none'}catch(e){document.querySelector('#connection').style.display='block'}}
async function change(alias,action){try{const res=await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json','X-Monitor-Token':token},body:JSON.stringify({alias,action})});const data=await res.json();if(!res.ok)throw Error(data.error);document.querySelector('#message').textContent='';await refresh()}catch(e){document.querySelector('#message').textContent=e.message}}
document.querySelector('#add').onsubmit=async e=>{e.preventDefault();await change(document.querySelector('#alias').value,'add');document.querySelector('#alias').value=''};
document.querySelector('#servers').onclick=e=>{const b=e.target.closest('[data-remove]');if(b)change(b.dataset.remove,'remove')};
refresh();setInterval(refresh,2000);
</script></html>
