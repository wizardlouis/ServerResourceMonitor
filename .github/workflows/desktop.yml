name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v1.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
          - os: ubuntu-24.04
            arch: x64
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: runner.os == 'Linux'
        name: Configure Chromium sandbox helper in ephemeral runner
        run: |
          node -e 'require("electron")'
          task_sandbox=$(node -p 'require("path").join(require("path").dirname(require("electron")), "chrome-sandbox")')
          sudo chown root:root "$task_sandbox"
          sudo chmod 4755 "$task_sandbox"
          xvfb-run -a pnpm smoke
      - if: runner.os != 'Linux'
        run: pnpm smoke
      - run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS'
        name: Verify packaged macOS app
        run: |
          codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Server Resource Monitor.app"
          "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Server Resource Monitor.app/Contents/MacOS/Server Resource Monitor" --package-check
      - if: runner.os == 'Linux'
        name: Verify packaged Linux app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a release/linux-unpacked/server-resource-monitor --package-check
      - if: runner.os == 'Windows'
        name: Verify packaged Windows app
        shell: pwsh
        run: |
          $result = Start-Process -FilePath "release/win-unpacked/Server Resource Monitor.exe" -ArgumentList "--package-check" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Packaged application failed: $($result.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            smoke-output/*.png
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets/release
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME — 跨平台桌面版" --notes-file ../../RELEASE_NOTES_1.0.3.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" *.dmg *.zip *.exe *.AppImage *.deb SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
